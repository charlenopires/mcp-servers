[project]
name = "mcp-servers"
version = "0.1.0"
description = "Coleção de servidores MCP especializados para análise de prompts, engenharia de prompts e suporte ao Tailwind CSS v4.1"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "MCP Servers Team" }
]
keywords = ["mcp", "model-context-protocol", "prompts", "tailwind", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=2.4.0",
    "mcp[cli]>=1.9.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.8.0",
    "questionary>=2.0.1",
    "colorama>=0.4.6",
    "rich>=13.0.0",
]

[project.scripts]
mcp_servers = "launcher_cli:main"
mcp-servers = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["servers"]
include = [
    "main.py",
    "launcher_cli.py",
    "run_servers.sh",
    "run_tests.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.pytest_asyncio]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]
