[project]
name = "mcp-servers"
version = "2.2.0"
description = "Collection of specialized MCP servers for prompt analysis, prompt engineering, and modern web development (React, Tailwind, shadcn/ui, Rust, Axum, Docker, Python, TypeScript)"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "MCP Servers Team" }
]
keywords = ["mcp", "model-context-protocol", "prompts", "tailwind", "analysis", "react", "rust", "typescript", "docker", "python"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=2.14.0",
    "mcp[cli]>=1.9.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.8.0",
    "questionary>=2.0.1",
    "colorama>=0.4.6",
    "rich>=13.0.0",
]

[project.scripts]
mcp_servers = "launcher_cli:main"
mcp-servers = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["servers"]
include = [
    "main.py",
    "launcher_cli.py",
    "run_servers.sh",
    "run_tests.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.pytest_asyncio]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]
